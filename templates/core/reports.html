{% extends 'core/base.html' %}{% block content %}<h2>Department Performance Report</h2><div class="card border-0 shadow-sm"><table class="table mb-0"><tr><th>Department</th><th>Students</th><th>Average 12th %</th><th>Average Approved CGPA</th></tr>{% for r in rows %}<tr><td>{{ r.department.name }}</td><td>{{ r.students }}</td><td>{{ r.avg12|floatformat:2 }}</td><td>{{ r.avgcgpa|floatformat:2 }}</td></tr>{% endfor %}</table></div>{% endblock %}

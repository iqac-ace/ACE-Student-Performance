{% extends 'core/base.html' %}{% block content %}<div class="d-flex justify-content-between"><h2>Subjects</h2><a class="btn btn-primary" href="{% url 'subject_add' %}">+ Subject</a></div><table class="table bg-white mt-3"><tr><th>Department</th><th>Sem</th><th>Code</th><th>Name</th><th>Credits</th></tr>{% for s in subjects %}<tr><td>{{ s.department.code }}</td><td>{{ s.semester }}</td><td>{{ s.code }}</td><td>{{ s.name }}</td><td>{{ s.credits }}</td></tr>{% endfor %}</table>{% endblock %}
